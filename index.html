<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>think Book M | AI Prompt Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-shell">
    <header class="site-header">
      <a class="brand" href="#home" aria-label="think Book M home">
        <span class="brand-mark">tM</span>
        <span>
          <strong>think Book M</strong>
          <small>Prompt Library</small>
        </span>
      </a>
      
      <div class="header-actions">
        <button class="icon-button" id="themeToggle" type="button" aria-label="Toggle dark mode">
          <span class="icon-sun" aria-hidden="true"></span>
        </button>
        <button class="primary-button" id="openCreateModal" type="button">
          <span class="plus-icon" aria-hidden="true"></span>
          New Prompt
        </button>
      </div>
    </header>

    <main id="home">
      <section class="hero-section">
        <div class="hero-copy">
          <p class="eyebrow">For creators, founders, and developers</p>
          <h1>Your sharpest AI prompts, organized beautifully.</h1>
          <p class="hero-text">
            Save, search, favorite, and reuse your best prompts in a fast local workspace that feels polished without needing a backend.
          </p>
          <div class="hero-actions">
            <button class="primary-button large" id="heroCreateButton" type="button">
              <span class="plus-icon" aria-hidden="true"></span>
              Add your first prompt
            </button>
            <a class="ghost-button" href="#library">Browse library</a>
          </div>
        </div>
